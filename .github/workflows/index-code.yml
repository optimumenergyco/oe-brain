name: Index Codebases

on:
  schedule:
    - cron: '0 7 * * *'  # 3am ET (7am UTC) daily
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  index-tesla-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout oe-brain
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install oe-brain
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout tesla-site
        uses: actions/checkout@v4
        with:
          repository: optimumenergyco/tesla-site
          token: ${{ secrets.GH_PAT }}
          path: repos/tesla-site

      - name: Index tesla-site
        run: node dist/cli.js index-code repos/tesla-site --incremental --repo-name tesla-site
        env:
          OE_BRAIN_API_URL: ${{ secrets.OE_BRAIN_API_URL }}
          OE_BRAIN_API_TOKEN: ${{ secrets.OE_BRAIN_API_TOKEN }}

  index-core-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout oe-brain
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install oe-brain
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout core-ui
        uses: actions/checkout@v4
        with:
          repository: optimumenergyco/core-ui
          token: ${{ secrets.GH_PAT }}
          path: repos/core-ui

      - name: Index core-ui
        run: node dist/cli.js index-code repos/core-ui --incremental --repo-name core-ui
        env:
          OE_BRAIN_API_URL: ${{ secrets.OE_BRAIN_API_URL }}
          OE_BRAIN_API_TOKEN: ${{ secrets.OE_BRAIN_API_TOKEN }}
