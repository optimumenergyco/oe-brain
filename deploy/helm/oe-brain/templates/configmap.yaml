apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oe-brain.fullname" . }}-config
  labels:
    {{- include "oe-brain.labels" . | nindent 4 }}
data:
  config.yml: |
    vault_path: {{ .Values.config.vaultPath }}
    context_dir: {{ .Values.config.contextDir }}
    database:
      connection_string: ${DATABASE_URL}
    ollama:
      base_url: {{ .Values.config.ollamaBaseUrl }}
      model: {{ .Values.config.ollamaModel }}
    {{- if .Values.config.openrouter.enabled }}
    openrouter:
      api_key: ${OPENROUTER_API_KEY}
      model: {{ .Values.config.openrouter.model }}
    {{- end }}
    projects: {}
    server:
      port: {{ .Values.config.serverPort }}
      api_token: ${API_TOKEN}
