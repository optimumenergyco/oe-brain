apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oe-brain.fullname" . }}
  labels:
    {{- include "oe-brain.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  API_TOKEN: {{ .Values.secrets.apiToken | quote }}
  {{- if .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
